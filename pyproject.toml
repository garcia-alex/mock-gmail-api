[project]
name = "mock-gmail-api"
version = "0.1.1"
description = "Mock Gmail REST API server + seeded synthetic email fixture generator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Garcia" }]
requires-python = ">=3.13"
dependencies = [
    "faker>=40.27.0",
    "fastapi>=0.121.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.0",
    "uvicorn>=0.38.0",
]

[project.urls]
Repository = "https://github.com/garcia-alex/mock-gmail-api"

[project.scripts]
mock-gmail-api = "mock_gmail_api.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

## Dependency cooldowns
[tool.uv]
exclude-newer = "2026-07-01T00:00:00Z"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "requests>=2.32.5",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "examples"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
