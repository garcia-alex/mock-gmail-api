name: Build and push image

# Publishes a versioned, pinned image to GHCR on every `v*` tag push, so
# downstream consumers (e.g. qantx-pipeline's docker-compose.test.yml) can
# pin to a specific reproducible tag instead of building from a local
# sibling checkout.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Strip leading v from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/garcia-alex/mock-gmail-api:${{ steps.version.outputs.version }}
            ghcr.io/garcia-alex/mock-gmail-api:latest
